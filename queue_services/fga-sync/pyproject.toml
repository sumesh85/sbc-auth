[project]
name = "fga-sync"
version = "0.1.0"
description = "OpenFGA tuple sync consumer for sbc-auth events"
authors = [{ name = "BC Registries and Online Services" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.poetry]
packages = [
    { include = "fga_sync", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
openfga-sdk = "^0.9.0"

# VCS dependencies
auth-api = { git = "https://github.com/bcgov/sbc-auth.git", branch = "main", subdirectory = "auth-api" }
simple-cloudevent = { git = "https://github.com/daxiom/simple-cloudevent.py.git" }
cloud-sql-python-connector = "^1.13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
